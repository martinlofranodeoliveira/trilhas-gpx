name: Testes da distribuição offline

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Preparar ferramentas fora do namespace dos testes
        run: |
          python -m pip install setuptools==78.1.1 wheel==0.46.3
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap util-linux
      - name: Construir sdist, wheel e testar instalação sem rede
        run: sudo "$(command -v python)" -B scripts/check.py
